<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="GamingTweaks - faster, quieter Windows for gaming, fully reversible">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F1A"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.82" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="0.08" cy="1" r="0.55">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glowBlue)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glowGreen)"/>

  <!-- icon: speedometer -->
  <g transform="translate(96,92)">
    <rect width="120" height="120" rx="28" fill="url(#icon)"/>
    <path d="M28 82 A34 34 0 1 1 92 82" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity="0.95"/>
    <path d="M60 78 L84 50" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
    <circle cx="60" cy="78" r="9" fill="#FFFFFF"/>
  </g>

  <!-- title -->
  <text x="248" y="150" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#F9FAFB" letter-spacing="-1.5">Gaming<tspan fill="url(#accent)">Tweaks</tspan></text>
  <text x="250" y="196" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#CBD5E1">Faster, quieter Windows for gaming — every change fully reversible.</text>

  <!-- chips -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600">
    <g transform="translate(250,236)">
      <rect width="196" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.07" stroke="#60A5FA" stroke-opacity="0.45"/>
      <circle cx="22" cy="20" r="5" fill="#60A5FA"/>
      <text x="36" y="26" fill="#E5E7EB">One-click revert</text>
    </g>
    <g transform="translate(458,236)">
      <rect width="236" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.07" stroke="#34D399" stroke-opacity="0.45"/>
      <circle cx="22" cy="20" r="5" fill="#34D399"/>
      <text x="36" y="26" fill="#E5E7EB">Store &amp; Xbox safe</text>
    </g>
    <g transform="translate(706,236)">
      <rect width="208" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.07" stroke="#FBBF24" stroke-opacity="0.45"/>
      <circle cx="22" cy="20" r="5" fill="#FBBF24"/>
      <text x="36" y="26" fill="#E5E7EB">Anti-cheat friendly</text>
    </g>
    <g transform="translate(926,236)">
      <rect width="196" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.07" stroke="#A78BFA" stroke-opacity="0.45"/>
      <circle cx="22" cy="20" r="5" fill="#A78BFA"/>
      <text x="36" y="26" fill="#E5E7EB">GUI + console</text>
    </g>
  </g>

  <text x="250" y="316" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#64748B">Windows 10 / 11  ·  Free &amp; open source  ·  No telemetry  ·  No installer</text>
</svg>
