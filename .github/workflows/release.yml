# Publishes a GitHub Release with a ready-to-download zip whenever the
# version number in GamingTweaks.ps1 changes on main.
name: Release

on:
  push:
    branches: [main]
    paths: ['GamingTweaks.ps1', 'CHANGELOG.md', 'README.txt', '*.cmd', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          v=$(grep -m1 -oP "^\\\$Version = '\K[0-9.]+" GamingTweaks.ps1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

      - name: Build zip and release notes
        id: build
        run: |
          zip -j GamingTweaks.zip GamingTweaks.ps1 Run-GamingTweaks.cmd Run-GamingTweaks-Console.cmd README.txt
          sha=$(sha256sum GamingTweaks.zip | cut -d' ' -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # Release notes = this version's section of CHANGELOG.md + how to use + checksum
          awk -v v="## v${{ steps.ver.outputs.version }}" '
            index($0, v) == 1 { on = 1; next }
            on && /^## v/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "---"
            echo
            echo "### How to use"
            echo "1. Download **GamingTweaks.zip** below and extract it"
            echo "2. Double-click **Run-GamingTweaks.cmd** and accept the admin prompt"
            echo "3. Check the tabs, click **Apply selected**, reboot"
            echo
            echo "Everything is backed up first - **Revert everything** undoes it all."
            echo
            echo "### Verify your download"
            echo "Built automatically by GitHub Actions from commit \`${GITHUB_SHA::7}\`."
            echo
            echo "| File | SHA-256 |"
            echo "|---|---|"
            echo "| GamingTweaks.zip | \`$sha\` |"
            echo
            echo "In PowerShell: \`Get-FileHash .\\GamingTweaks.zip\` - the hash should match."
          } >> notes.md
          cat notes.md

      - name: Publish or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.ver.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" GamingTweaks.zip --clobber
            gh release edit "$tag" --title "GamingTweaks $tag" --notes-file notes.md
          else
            gh release create "$tag" GamingTweaks.zip --title "GamingTweaks $tag" --notes-file notes.md --latest
          fi
